# Fiat Lux - shaderpack para Iris (Minecraft 1.21.1, Fabric), feito para o mod Elementar
oldLighting=false
oldHandLight=false
underwaterOverlay=false
vignette=false
sun=true
moon=true
clouds=off

# Recursos do Iris usados pela luz colorida (imagens 3D + compute shader)
# chuva/neve em colortex8: cor pré-multiplicada, alfa = cobertura
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# membrana do slime: a cor mistura com o miolo; normal e lightmap/material não podem misturar
blend.gbuffers_entities_translucent = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex1 = off
blend.gbuffers_entities_translucent.colortex2 = off
# São opcionais: sem eles (Mac, placas sem OpenGL 4.3) o pack abre e só a luz colorida desliga.
iris.features.optional = CUSTOM_IMAGES COMPUTE_SHADERS

screen=<profile> <empty> [LIGHTING] [COLORED] [SHADOWS] [WIND] [WATER] [SKY] [ALTITUDE] [CHERENKOV] [MOBS] [POST]
screen.LIGHTING=SUN_BRIGHTNESS AMBIENT_STRENGTH AMBIENT_SKY_SCALE GROUND_BOUNCE BLOCKLIGHT_STRENGTH MIN_LIGHT EMISSIVE_STRENGTH TORCH_FLICKER HAND_LIGHT TORCH_R TORCH_G TORCH_B
screen.COLORED=COLORED_LIGHTS COLORED_LIGHT_RANGE LPS_DESATURATION ARC_FLICKER
screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation
screen.WIND=WAVING_FOLIAGE WIND_STRENGTH WIND_SPEED
screen.WATER=WATER_TYPE BRINE_STYLE WATER_ABSORPTION_SCALE WATER_WAVE_TYPE WATER_REFLECTIONS SSR_STEPS WATER_REFRACTION REFRACTION_STRENGTH SNELL_WINDOW WATER_OPACITY WAVE_STRENGTH WAVE_SPEED
screen.SKY=BIOME_SKY PROCEDURAL_CLOUDS DRY_SKY_VIBRANCE SKY_BRIGHTNESS CLOUD_COVERAGE CLOUD_OPACITY CLOUD_SPEED OVERCAST_STRENGTH FOG_DENSE_STRENGTH FOG_HUMID_STRENGTH CLOUD_HEIGHT CIRRUS_HEIGHT ALT_START ALT_FULL ALT_SKY_DEEPEN ALT_FOG_CLEAR ALT_SUN_BOOST
screen.ALTITUDE=CLOUD_HEIGHT CLOUD_LAYERS CLOUD_LAYER_GAP CLOUD_RAIN_DROP CLOUD_BIOME_SHIFT CIRRUS_HEIGHT SKY_HAZE AERIAL_PERSPECTIVE AERIAL_STRENGTH ALT_START ALT_FULL ALT_SKY_DEEPEN ALT_FOG_CLEAR ALT_SUN_BOOST CLEAR_ABOVE_CLOUDS HIGH_ALT_RANGE HIGH_ALT_DARKEN RAIN_STYLE RAIN_OPACITY RAIN_SPEED SNOW_FOG STORM_DARKNESS
screen.CHERENKOV=CHERENKOV_STRENGTH CHERENKOV_SPEED CHERENKOV_WATER_BOOST
screen.MOBS=SLIME_TRANSLUCENT SLIME_OPACITY
screen.POST=AA_MODE TAA_SHARPEN TAA_BLEND <empty> SATURATION EXPOSURE BLOOM_STRENGTH BLOOM_RADIUS

sliders=STORM_DARKNESS SLIME_OPACITY FOG_HUMID_STRENGTH WIND_STRENGTH WIND_SPEED SKY_HAZE REFRACTION_STRENGTH SNOW_FOG RAIN_OPACITY RAIN_SPEED TAA_SHARPEN TAA_BLEND CLOUD_BIOME_SHIFT AERIAL_STRENGTH CLOUD_LAYER_GAP CLOUD_RAIN_DROP COLORED_LIGHT_RANGE LPS_DESATURATION shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SUN_BRIGHTNESS AMBIENT_STRENGTH BLOCKLIGHT_STRENGTH MIN_LIGHT EMISSIVE_STRENGTH TORCH_R TORCH_G TORCH_B SSR_STEPS WATER_OPACITY WAVE_STRENGTH WAVE_SPEED CHERENKOV_STRENGTH CHERENKOV_SPEED CHERENKOV_WATER_BOOST BLOOM_STRENGTH BLOOM_RADIUS EXPOSURE SATURATION DRY_SKY_VIBRANCE SKY_BRIGHTNESS CLOUD_COVERAGE CLOUD_OPACITY CLOUD_SPEED OVERCAST_STRENGTH FOG_DENSE_STRENGTH CLOUD_HEIGHT CIRRUS_HEIGHT ALT_START ALT_FULL ALT_SKY_DEEPEN ALT_FOG_CLEAR ALT_SUN_BOOST HIGH_ALT_RANGE HIGH_ALT_DARKEN WATER_TYPE WATER_ABSORPTION_SCALE WATER_WAVE_TYPE AMBIENT_SKY_SCALE GROUND_BOUNCE

profile.BAIXO=shadowMapResolution=1024 shadowDistance=64.0 SSR_STEPS=12 !WATER_REFLECTIONS !COLORED_LIGHTS COLORED_LIGHT_RANGE=64 !ARC_FLICKER CLOUD_LAYERS=1 AA_MODE=1 WAVING_FOLIAGE
profile.MEDIO=shadowMapResolution=2048 shadowDistance=128.0 SSR_STEPS=24 WATER_REFLECTIONS COLORED_LIGHTS COLORED_LIGHT_RANGE=64 ARC_FLICKER CLOUD_LAYERS=3 AA_MODE=2
profile.ALTO=shadowMapResolution=4096 shadowDistance=192.0 SSR_STEPS=48 WATER_REFLECTIONS COLORED_LIGHTS COLORED_LIGHT_RANGE=128 ARC_FLICKER CLOUD_LAYERS=3 AA_MODE=2

# ---- Luz colorida: mapa 3D de blocos (refeito a cada quadro) e dois volumes de cor que se alternam ----
#if defined COLORED_LIGHTS && defined IRIS_FEATURE_CUSTOM_IMAGES && defined IRIS_FEATURE_COMPUTE_SHADERS
#if COLORED_LIGHT_RANGE == 64
image.voxelImg = voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 64 32 64
image.floodImgA = floodSamplerA RGBA RGBA16F HALF_FLOAT false false 64 32 64
image.floodImgB = floodSamplerB RGBA RGBA16F HALF_FLOAT false false 64 32 64
#else
image.voxelImg = voxelSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 64 128
image.floodImgA = floodSamplerA RGBA RGBA16F HALF_FLOAT false false 128 64 128
image.floodImgB = floodSamplerB RGBA RGBA16F HALF_FLOAT false false 128 64 128
#endif
#endif
#if defined IRIS_FEATURE_CUSTOM_IMAGES && defined IRIS_FEATURE_COMPUTE_SHADERS
program.shadowcomp.enabled = COLORED_LIGHTS
#else
program.shadowcomp.enabled = false
#endif

# ---- Céu por bioma (gerado a partir da tabela Céu por bioma) ----
uniform.float.skyVivid = smooth(smooth(smooth(if(in(biome, BIOME_DESERT, BIOME_SAVANNA, BIOME_SAVANNA_PLATEAU, BIOME_WINDSWEPT_SAVANNA, BIOME_BADLANDS, BIOME_ERODED_BADLANDS, BIOME_WOODED_BADLANDS, BIOME_STONY_PEAKS, BIOME_JAGGED_PEAKS, BIOME_FROZEN_PEAKS), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.skyHazy = smooth(smooth(smooth(if(in(biome, BIOME_MEADOW, BIOME_CHERRY_GROVE, BIOME_MUSHROOM_FIELDS, BIOME_FOREST, BIOME_FLOWER_FOREST, BIOME_JUNGLE, BIOME_SPARSE_JUNGLE, BIOME_BAMBOO_JUNGLE), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.biomeOvercast = smooth(smooth(smooth(if(in(biome, BIOME_DARK_FOREST, BIOME_OLD_GROWTH_PINE_TAIGA, BIOME_OLD_GROWTH_SPRUCE_TAIGA, BIOME_SWAMP, BIOME_MANGROVE_SWAMP), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.cloudCirrus = smooth(smooth(smooth(if(in(biome, BIOME_DESERT, BIOME_SAVANNA, BIOME_SAVANNA_PLATEAU, BIOME_WINDSWEPT_SAVANNA, BIOME_BADLANDS, BIOME_ERODED_BADLANDS, BIOME_WOODED_BADLANDS), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.cloudStratus = smooth(smooth(smooth(if(in(biome, BIOME_DARK_FOREST, BIOME_OLD_GROWTH_PINE_TAIGA, BIOME_OLD_GROWTH_SPRUCE_TAIGA, BIOME_SNOWY_TAIGA, BIOME_SNOWY_PLAINS, BIOME_ICE_SPIKES, BIOME_GROVE, BIOME_SWAMP, BIOME_MANGROVE_SWAMP, BIOME_SNOWY_SLOPES, BIOME_FROZEN_RIVER, BIOME_FROZEN_OCEAN), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.cloudFew = smooth(smooth(smooth(if(in(biome, BIOME_STONY_PEAKS, BIOME_JAGGED_PEAKS, BIOME_FROZEN_PEAKS), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.cloudNone = 0.0
uniform.float.fogLight = smooth(smooth(smooth(if(in(biome, BIOME_DESERT, BIOME_SAVANNA, BIOME_SAVANNA_PLATEAU, BIOME_WINDSWEPT_SAVANNA, BIOME_BADLANDS, BIOME_ERODED_BADLANDS, BIOME_WOODED_BADLANDS, BIOME_STONY_PEAKS, BIOME_JAGGED_PEAKS, BIOME_FROZEN_PEAKS), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.fogDense = smooth(smooth(smooth(if(in(biome, BIOME_MUSHROOM_FIELDS, BIOME_SWAMP, BIOME_MANGROVE_SWAMP), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
# selva: neblina úmida moderada (mais leve que a Densa)
uniform.float.fogHumid = smooth(smooth(smooth(if(in(biome, BIOME_JUNGLE, BIOME_SPARSE_JUNGLE, BIOME_BAMBOO_JUNGLE), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)

# ---- Cor da água por bioma (Tipo de água = Por líquido e bioma) ----
uniform.float.waterSea = smooth(smooth(smooth(if(in(biome, BIOME_OCEAN, BIOME_DEEP_OCEAN, BIOME_WARM_OCEAN, BIOME_LUKEWARM_OCEAN, BIOME_DEEP_LUKEWARM_OCEAN, BIOME_COLD_OCEAN, BIOME_DEEP_COLD_OCEAN, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN, BIOME_BEACH, BIOME_SNOWY_BEACH, BIOME_STONY_SHORE), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.waterWarm = smooth(smooth(smooth(if(in(biome, BIOME_WARM_OCEAN, BIOME_LUKEWARM_OCEAN, BIOME_DEEP_LUKEWARM_OCEAN), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.waterCold = smooth(smooth(smooth(if(in(biome, BIOME_COLD_OCEAN, BIOME_DEEP_COLD_OCEAN, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN, BIOME_DEEP_OCEAN, BIOME_TAIGA, BIOME_OLD_GROWTH_PINE_TAIGA, BIOME_OLD_GROWTH_SPRUCE_TAIGA, BIOME_SNOWY_TAIGA, BIOME_SNOWY_PLAINS, BIOME_ICE_SPIKES, BIOME_GROVE, BIOME_SNOWY_BEACH), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.waterGlacial = smooth(smooth(smooth(if(in(biome, BIOME_SNOWY_PLAINS, BIOME_ICE_SPIKES, BIOME_SNOWY_TAIGA, BIOME_SNOWY_SLOPES, BIOME_GROVE, BIOME_FROZEN_PEAKS, BIOME_JAGGED_PEAKS, BIOME_STONY_PEAKS, BIOME_MEADOW, BIOME_CHERRY_GROVE, BIOME_TAIGA, BIOME_OLD_GROWTH_PINE_TAIGA, BIOME_OLD_GROWTH_SPRUCE_TAIGA, BIOME_WINDSWEPT_HILLS, BIOME_WINDSWEPT_GRAVELLY_HILLS, BIOME_WINDSWEPT_FOREST, BIOME_FROZEN_RIVER), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.waterSwamp = smooth(smooth(smooth(if(in(biome, BIOME_SWAMP, BIOME_MANGROVE_SWAMP), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
uniform.float.waterMud = smooth(smooth(smooth(if(in(biome, BIOME_SAVANNA, BIOME_WINDSWEPT_SAVANNA, BIOME_SAVANNA_PLATEAU, BIOME_BADLANDS, BIOME_ERODED_BADLANDS, BIOME_JUNGLE, BIOME_SPARSE_JUNGLE, BIOME_BAMBOO_JUNGLE), 1.0, 0.0), 22.0, 22.0), 22.0, 22.0), 22.0, 22.0)
# neve no lugar da chuva (bioma frio): mais neblina, flocos lentos
uniform.float.snowFall = smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 30.0, 30.0)
