# Pasta de programas por dimensão (Iris). Dimensões fora desta lista usam a raiz de shaders/.
# A Lua do Elementar não tem atmosfera: céu preto, sem névoa, nuvens nem chuva (DIM_MOON).
# As pastas moon/, mars/, mercury/ e venus/ são geradas por tools/gen_dims.py.
dimension.moon = periodic_elements:moon
# Marte: atmosfera fina e empoeirada, céu caramelo, pôr do sol azul, tempestades de poeira (DIM_MARS).
dimension.mars = periodic_elements:mars
# Mercúrio: sem ar como a Lua (DIM_MOON + DIM_MERCURY); o Sol segue a linha da aurora, não o relógio.
dimension.mercury = periodic_elements:mercury
# Vênus: atmosfera densa e clara acima das nuvens de ácido (DIM_VENUS).
dimension.venus = periodic_elements:venus
