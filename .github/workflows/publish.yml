# Publica o Fiat Lux no GitHub Releases e no Modrinth.
# Como usar: aba "Actions" > "Publish" > "Run workflow".
# A versao vem do arquivo VERSION; as notas vem de CHANGELOG.md.
# Configuracao (Settings > Secrets and variables > Actions):
#   Secret:   MODRINTH_TOKEN   (o mesmo token do Elementar serve)
#   Variable: MODRINTH_ID      (ID do projeto Fiat Lux no Modrinth, 8 caracteres)
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only build the zip (no upload)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: meta
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          case "$VERSION" in
            *alpha*) TYPE=alpha ;;
            *beta*|*rc*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Build shaderpack zip
        run: |
          test -f shaders/shaders.properties
          mkdir -p dist
          zip -r -X "dist/FiatLux-${{ steps.meta.outputs.version }}.zip" shaders LICENSE README.md CREDITS.md
          unzip -l dist/*.zip | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: fiat-lux-zip
          path: dist/*.zip

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: Fiat Lux ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: CHANGELOG.md
          files: dist/*.zip
          loaders: iris
          game-versions: 1.21.1

          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          github-tag: v${{ steps.meta.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-prerelease: ${{ steps.meta.outputs.type != 'release' }}
